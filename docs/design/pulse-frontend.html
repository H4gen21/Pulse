<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pulse — Non-custodial inheritance guard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
:root{
  color-scheme: light;
  --bg:#F4F1FE; --surface:#FFFFFF; --surface-2:#EEEAFB; --ink:#2B2347; --muted:#5F5879; --line:#E5DFF7;
  --accent:#AB9FF2; --accent-hover:#9C8EEE; --on-accent:#1E173A; --accent-ink:#5B45D6; --accent-soft:#E6E0FD;
  --pulse:#D0402F; --pulse-soft:#FCE9E6; --ok:#13865F; --ok-soft:#DDF4EA;
  --card-dark:#1E1B27; --card-grey:#EBE9F0; --card-mint:#C4ECD9;
  --shadow:0 1px 2px rgba(43,35,71,.05),0 10px 30px rgba(91,69,214,.07);
  --r-lg:32px; --r-md:22px; --radius:22px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#121019; --surface:#1C1927; --surface-2:#262236; --ink:#F2EFFC; --muted:#ADA6C8; --line:#2F2A43;
    --accent:#AB9FF2; --accent-hover:#BDB3F6; --on-accent:#1B1433; --accent-ink:#C9BFFF; --accent-soft:#2C2550;
    --pulse:#FF8270; --pulse-soft:#3A1D1C; --ok:#55D4A8; --ok-soft:#14302A;
    --card-dark:#0B0A10; --card-grey:#2A2735; --card-mint:#1F3B31;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#121019; --surface:#1C1927; --surface-2:#262236; --ink:#F2EFFC; --muted:#ADA6C8; --line:#2F2A43;
  --accent:#AB9FF2; --accent-hover:#BDB3F6; --on-accent:#1B1433; --accent-ink:#C9BFFF; --accent-soft:#2C2550;
  --pulse:#FF8270; --pulse-soft:#3A1D1C; --ok:#55D4A8; --ok-soft:#14302A;
  --card-dark:#0B0A10; --card-grey:#2A2735; --card-mint:#1F3B31;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 96px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{font-family:inherit;letter-spacing:-.025em;margin:0;font-weight:700}
p{margin:0}
a{color:var(--accent-ink)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent-ink);outline-offset:2px;border-radius:10px}
img,svg{max-width:100%}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
.topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-top:16px;padding-bottom:16px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand b{font-size:26px;font-weight:800;letter-spacing:-.04em}
.pillnav{display:flex;gap:2px;padding:6px;background:var(--surface);border-radius:999px;box-shadow:var(--shadow);overflow-x:auto;max-width:100%}
.pillnav a{padding:10px 18px;border-radius:999px;text-decoration:none;color:var(--ink);font-weight:500;white-space:nowrap;transition:background .2s}
.pillnav a:hover{background:var(--surface-2)}
.pillnav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent-ink)}
@media (max-width:900px){.pillnav{order:3;flex:1 1 100%}}
.who{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.round{width:48px;height:48px;border-radius:50%;border:0;background:var(--surface);box-shadow:var(--shadow);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
.round:hover{background:var(--surface-2)}
.chip{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);font-size:14px;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:50px;padding:0 26px;border-radius:999px;border:1px solid transparent;font-weight:600;font-size:16px;text-decoration:none;cursor:pointer;transition:background .2s,transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:var(--accent-hover)}
.btn-ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn-ghost:hover{border-color:var(--accent)}
.btn-soft{background:var(--accent-soft);color:var(--accent-ink)}
.btn-danger{background:var(--pulse);color:#FFFFFF}
:root[data-theme="dark"] .btn-danger{color:#1A0805}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn-danger{color:#1A0805}}
.btn-outline-danger{background:transparent;color:var(--pulse);border-color:var(--pulse)}
.btn-sm{min-height:42px;padding:0 18px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.icon-btn{width:46px;height:46px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--muted)}
.icon-btn:hover{color:var(--ink);border-color:var(--accent)}

/* cards */
.card{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow)}
.pad{padding:28px}
.grid{display:grid;gap:16px}
.cols-auto{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.badge{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;font-size:13px;font-weight:700}
.b-active{background:var(--accent-soft);color:var(--accent-ink)}
.b-exec{background:var(--ok-soft);color:var(--ok)}
.b-revoked{background:var(--surface-2);color:var(--muted)}

/* hero */
.hero-card{position:relative;overflow:hidden;border-radius:var(--r-lg);min-height:640px;display:flex;align-items:center;justify-content:center;text-align:center;color:#FFFFFF;
  background:
   radial-gradient(520px 420px at 18% 28%,rgba(168,214,92,.55),transparent 70%),
   radial-gradient(560px 460px at 82% 22%,rgba(150,214,190,.45),transparent 70%),
   radial-gradient(700px 520px at 55% 85%,rgba(171,159,242,.7),transparent 70%),
   #3A2F7E}
.hero-card::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.22;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
.hero-inner{position:relative;z-index:2;padding:80px 24px;max-width:980px}
.hero-kicker{font-size:20px;font-weight:600;color:rgba(255,255,255,.82)}
.hero-card h1{font-size:clamp(2.7rem,6.4vw,5.6rem);line-height:1.02;font-weight:600;letter-spacing:-.035em;margin-top:18px}
.hero-card .btn-hero{margin-top:44px;background:#E6E0FD;color:#2B2347;min-height:64px;padding:0 34px;font-size:19px;font-weight:600}
.hero-card .btn-hero:hover{background:#FFFFFF}
.float{position:absolute;z-index:1;transform:translate3d(calc(var(--mx,0) * var(--d,10px)),calc(var(--my,0) * var(--d,10px)),0);transition:transform .4s ease-out;pointer-events:none}
.float > *{animation:bob 7s ease-in-out infinite}
@keyframes bob{0%,100%{translate:0 0;rotate:0deg}50%{translate:0 -14px;rotate:3deg}}
.coin{width:210px;height:210px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#E9E4FF,#AB9FF2 45%,#6A57D8 100%);box-shadow:inset -10px -14px 30px rgba(40,20,110,.45),inset 8px 10px 20px rgba(255,255,255,.55),0 30px 60px rgba(20,10,60,.35);display:flex;align-items:center;justify-content:center;border:10px solid rgba(255,255,255,.18)}
.ticket{padding:18px 26px;border-radius:18px;background:#B7EBCF;color:#14352A;font-size:34px;font-weight:800;letter-spacing:-.03em;box-shadow:0 20px 40px rgba(10,30,20,.3)}
.ticket.lav{background:#E6E0FD;color:#2B2347}
.spark{color:#E8F7A8}
@media (max-width:820px){.f-coin{display:none}.hero-card{min-height:560px}}
@media (prefers-reduced-motion: reduce){.float > *{animation:none}.float{transition:none}}

/* sections */
section.band{padding:110px 0}
.display{font-size:clamp(2.6rem,7vw,6rem);line-height:1.04;letter-spacing:-.04em;font-weight:600;text-align:center}
.mark-inline{display:inline-block;width:1.05em;height:.95em;vertical-align:-.12em;margin:0 .12em}
.h2{font-size:clamp(2rem,4vw,3.2rem);font-weight:600;letter-spacing:-.035em;line-height:1.06}
.center{text-align:center}

/* rail */
.rail-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.rail-ctrl{display:flex;gap:8px}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(300px,calc((100% - 48px)/3));gap:24px;overflow-x:auto;scroll-snap-type:x mandatory;padding:8px 4px 28px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
@media (max-width:1000px){.rail{grid-auto-columns:minmax(300px,78%)}}
.fcard{scroll-snap-align:start;border-radius:var(--r-lg);min-height:600px;padding:40px;display:flex;flex-direction:column;gap:28px;overflow:hidden;position:relative;transition:transform .45s cubic-bezier(.2,.8,.2,1),box-shadow .45s}
.fcard:hover{transform:translateY(-8px);box-shadow:0 30px 60px rgba(43,35,71,.18)}
.fcard h3{font-size:34px;line-height:1.14;font-weight:600;letter-spacing:-.025em;max-width:13em}
.fcard .art{flex:1;display:flex;align-items:flex-end;justify-content:center;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.fcard:hover .art{transform:scale(1.04) rotate(-1.5deg)}
.c-lav{background:var(--accent);color:#1E173A}
.c-dark{background:var(--card-dark);color:#F3F0FF}
.c-grey{background:var(--card-grey);color:var(--ink)}
.c-mint{background:var(--card-mint);color:var(--ink)}
.phone{width:min(330px,100%);background:#0F0E14;border-radius:40px 40px 0 0;padding:22px 20px 34px;margin-bottom:-40px;color:#FFFFFF;box-shadow:0 0 0 8px #000 inset}
.toastpill{display:flex;align-items:center;gap:10px;background:#26232F;border-radius:16px;padding:12px 14px;font-size:15px;font-weight:500;animation:drop 4s ease-in-out infinite}
@keyframes drop{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
.okdot{width:26px;height:26px;border-radius:50%;background:#2CCB86;display:flex;align-items:center;justify-content:center;color:#0B2B1D;flex:none}
.tile{width:150px;height:150px;border-radius:38px;background:var(--accent);display:flex;align-items:center;justify-content:center;box-shadow:0 30px 60px rgba(171,159,242,.25)}
.beat{stroke-dasharray:170;stroke-dashoffset:170;animation:beat 2.6s ease-in-out infinite}
@keyframes beat{0%{stroke-dashoffset:170}45%,70%{stroke-dashoffset:0}100%{stroke-dashoffset:-170}}
.twinkle{animation:tw 2.4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
.tk{position:absolute;padding:10px 22px;border-radius:12px;font-weight:800;font-size:28px;letter-spacing:-.02em}
@media (prefers-reduced-motion: reduce){.beat{animation:none;stroke-dashoffset:0}.twinkle,.toastpill{animation:none}.fcard,.fcard .art{transition:none}.fcard:hover{transform:none}.fcard:hover .art{transform:none}}

.reveal{opacity:0;transform:translateY(24px);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.8,.2,1)}
.reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion: reduce){.reveal{opacity:1;transform:none;transition:none}}

.steps{list-style:none;padding:0;margin:44px 0 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
.steps li{padding:30px;border-radius:var(--r-md);background:var(--surface);box-shadow:var(--shadow);transition:transform .35s}
.steps li:hover{transform:translateY(-4px)}
.steps .n{display:inline-flex;width:44px;height:44px;border-radius:50%;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent-ink);font-weight:800;font-size:18px}
.steps h3{font-size:22px;margin:18px 0 8px;font-weight:600}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:44px}
.rules div{background:var(--surface);border-radius:var(--r-md);padding:28px;box-shadow:var(--shadow)}
.rules b{display:block;font-size:34px;font-weight:700;letter-spacing:-.03em;color:var(--accent-ink);margin-bottom:4px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;margin-top:20px}
.list-check{list-style:none;padding:0;margin:16px 0 0;display:flex;flex-direction:column;gap:14px}
.list-check li{display:flex;gap:12px;align-items:flex-start}
.list-check svg{flex:none;margin-top:2px}
.faq{max-width:820px;margin:40px auto 0;display:flex;flex-direction:column;gap:12px}
.faq details{background:var(--surface);border-radius:20px;padding:0 24px;box-shadow:var(--shadow)}
.faq summary{cursor:pointer;padding:22px 0;font-weight:600;font-size:18px;list-style:none;display:flex;justify-content:space-between;gap:12px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";color:var(--accent-ink);font-size:24px;line-height:1;transition:transform .25s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq details p{padding:0 0 22px;color:var(--muted)}

/* forms */
label.lbl{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
.field{width:100%;min-height:50px;padding:12px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.field:focus{border-color:var(--accent-ink);outline:none;box-shadow:0 0 0 4px var(--accent-soft)}
.field.bad{border-color:var(--pulse)}
.err{color:var(--pulse);font-size:13px;margin-top:4px;min-height:1em}
input[type=range]{width:100%;accent-color:var(--accent-ink);min-height:44px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{min-height:42px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-ink);color:var(--accent-ink)}

/* app pages */
main.app{padding:32px 0 110px}
.page-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:28px}
.page-head h1{font-size:clamp(2.2rem,4.4vw,3.4rem);font-weight:600;letter-spacing:-.035em}
.timer{display:flex;flex-wrap:wrap;gap:32px;align-items:center;padding:36px;background:var(--accent);color:#1E173A;border-radius:var(--r-lg)}
.timer .muted{color:#3B3260}
.timer .btn-primary{background:#1E173A;color:#FFFFFF}
.timer .btn-primary:hover{background:#2E2556}
.count{display:flex;gap:10px;flex-wrap:wrap}
.count div{min-width:92px;padding:14px 16px;border-radius:20px;background:rgba(255,255,255,.6);text-align:center}
.count b{display:block;font-size:44px;line-height:1;font-weight:700;letter-spacing:-.03em}
.count span{font-size:13px;color:#3B3260;font-weight:500}
.bar{height:10px;border-radius:999px;background:rgba(30,23,58,.15);overflow:hidden}
.bar i{display:block;height:100%;background:#1E173A;border-radius:999px;transition:width .6s}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-weight:600;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:16px 12px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto}
.addr{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px}
.feed{list-style:none;padding:0;margin:0}
.feed li{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.feed li:last-child{border-bottom:0}
.feed .ic{flex:none;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
.feed time{margin-left:auto;color:var(--muted);font-size:14px;white-space:nowrap}
.demo{background:var(--card-grey);border-radius:var(--r-md);padding:22px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.empty{text-align:center;padding:72px 24px;display:flex;flex-direction:column;align-items:center;gap:16px}
.empty h1{font-weight:600}
.heir-row{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1.8fr) 110px 46px;gap:12px;align-items:start;padding:14px 0;border-bottom:1px solid var(--line)}
@media (max-width:760px){.heir-row{grid-template-columns:1fr 1fr}.heir-row .w{grid-column:1/-1}}
.total{display:flex;align-items:baseline;gap:10px}
.total b{font-size:28px;font-weight:700}
.review{background:var(--card-dark);color:#F3F0FF;border-radius:var(--r-lg);padding:30px}
.review .muted{color:#B5AECF}
.review .feed li{border-color:#2E2A3C}
.layout{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.layout .main{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:20px}
.layout .side{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:20px}
@media (min-width:1000px){.layout .side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 100px)}}

/* modal + toast */
.backdrop{position:fixed;inset:0;background:rgba(18,12,40,.5);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.backdrop.open{display:flex}
.modal{width:min(460px,100%);background:var(--surface);border-radius:28px;padding:28px;box-shadow:0 30px 80px rgba(0,0,0,.3);animation:pop .25s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.wallet-opt{display:flex;align-items:center;gap:14px;width:100%;padding:16px;border-radius:18px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;font-weight:600;transition:background .2s}
.wallet-opt:hover{border-color:var(--accent);background:var(--accent-soft)}
.siwe{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;background:var(--surface-2);border-radius:16px;padding:16px;white-space:pre-wrap;word-break:break-all;color:var(--ink)}
.spinner{width:48px;height:48px;border-radius:50%;border:4px solid var(--accent-soft);border-top-color:var(--accent-ink);animation:spin .9s linear infinite;margin:8px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;z-index:60;max-width:min(380px,calc(100% - 32px))}
.toast{background:var(--ink);color:var(--bg);padding:14px 18px;border-radius:18px;box-shadow:0 12px 30px rgba(0,0,0,.25);font-size:15px;font-weight:500;animation:pop .25s ease}
footer.foot{padding:40px 0;color:var(--muted);font-size:14px}
footer.foot .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:center}
.linkish{background:none;border:0;padding:0;color:var(--accent-ink);text-decoration:underline;cursor:pointer;font-size:inherit;font-weight:600}
</style>
</head>
<body>

<header class="top">
  <div class="wrap topbar">
    <a class="brand" href="#home" aria-label="Pulse home">
      <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="13" fill="#AB9FF2"></rect><path d="M6 21h7l2.5-6 4 12 3.5-15 2.5 9H34" fill="none" stroke="#2B2347" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      <b>pulse</b>
    </a>
    <nav class="pillnav" aria-label="Main">
      <a href="#home" data-nav="home">Home</a>
      <a href="#vault" data-nav="vault">Dashboard</a>
      <a href="#create" data-nav="create">Create vault</a>
      <a href="#verify" data-nav="verify">Verify</a>
    </nav>
    <div class="who">

    revealObs = new IntersectionObserver(function(entries){
      entries.forEach(function(en){ if (en.isIntersecting){ en.target.classList.add("in"); revealObs.unobserve(en.target); } });
    }, { threshold: 0.12 });
    els.forEach(function(el, i){ el.style.transitionDelay = (i % 4) * 70 + "ms"; revealObs.observe(el); });

    if (hero && !(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches)){
      hero.addEventListener("pointermove", function(e){
        var r = hero.getBoundingClientRect();

        hero.style.setProperty("--my", ((e.clientY - r.top) / r.height - 0.5).toFixed(3));

  function validateDraft(){
    var d = draft, problems = [];
    var amt = parseAmount(d.amount);
    if (amt === null || amt === 0n) problems.push("Enter an approval amount.");
    if (!d.approved) problems.push("Approve the token in step 1.");
    var bps = d.heirs.map(function(h){ return pctToBps(h.pct); });
    var total = bps.reduce(function(a, b){ return a + b; }, 0);
    if (total !== 10000) problems.push("Heir shares must add up to exactly 100%.");
    var seen = {};
    d.heirs.forEach(function(h, i){
      var w = h.wallet.trim();
      if (!isAddr(w)) problems.push("Heir " + (i + 1) + " needs a valid wallet address.");
      else if (w.toLowerCase() === (S.address || "").toLowerCase()) problems.push("Heir " + (i + 1) + " can’t be your own wallet.");
      else if (seen[w.toLowerCase()]) problems.push("Heir " + (i + 1) + " is a duplicate wallet.");
      seen[w.toLowerCase()] = true;
      if (!isEmail(h.email.trim())) problems.push("Heir " + (i + 1) + " needs a valid email.");
      if (bps[i] <= 0) problems.push("Heir " + (i + 1) + " needs a share above 0%.");
    });
    return { problems: problems, total: total, bps: bps, amt: amt };
  }

          '</div>' +
          '<h3 style="font-size:18px;margin-top:24px">Heirs</h3><ul class="feed">' +
            v.heirs.map(function(h, i){ return '<li><span class="ic">' + (i + 1) + '</span><span class="addr">' + short(h.wallet) + '</span><time class="num" style="color:var(--ink);font-weight:600">' + (h.bps / 100).toFixed(2) + '%</time></li>'; }).join("") +
          '</ul>' +
          '<p class="muted" style="font-size:14px;margin-top:16px;padding:14px;border-radius:12px;background:var(--surface-2)">' + (own ? "This is your vault. Heir emails are hidden here for everyone, including you." : "Heir emails are never shown on this page.") + ' Status read from the contract on Base Sepolia.</p>' +
        '</section>';
      }
    }
    return '<main class="app"><div class="wrap" style="max-width:860px">' +
      '<div class="page-head"><div><h1>Verify a vault</h1><p class="muted">Anyone can check a vault’s status. No sign-in needed.</p></div></div>' +
      '<form class="card pad" id="verify-form" role="search" style="display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end">' +
        '<div style="flex:1 1 360px;min-width:0"><label class="lbl" for="vq">Owner wallet address</label><input class="field addr" id="vq" placeholder="0x…" value="' + esc(q) + '" autocomplete="off" spellcheck="false"></div>' +
        '<button class="btn btn-primary" type="submit">Check</button>' +
        '<div style="flex:1 1 100%;font-size:14px" class="muted">Try: <button class="linkish" type="button" data-sample="0x5E11aB22cD33eF44aB55cD66eF77aB88cD99eF00">an active vault</button>, <button class="linkish" type="button" data-sample="0x8F2aD0b1C2e3F4a5B6c7D8e9F0a1B2c3D4e5F6a7">an executed vault</button>' + (S.vault ? ', <button class="linkish" type="button" data-sample="' + S.address + '">your vault</button>' : '') + '</div>' +
      '</form>' +
      '<div style="margin-top:20px">' + result + '</div>' +
    '</div></main>';
  }
  var verifyQuery = "";

  // ---------- dashboard live timer ----------
  function tick(){
    var v = S.vault;
    if (v && v.status === "ACTIVE" && now() >= deadline(v)) { execute(); return; }
    if (route() !== "vault" || !v || v.status !== "ACTIVE" || !$("#count")) return;
    var left = Math.max(0, deadline(v) - now());
    var d = Math.floor(left / DAY), h = Math.floor(left % DAY / 3600000), m = Math.floor(left % 3600000 / 60000), s = Math.floor(left % 60000 / 1000);
    $("#count").innerHTML = [[d, "days"], [h, "hours"], [m, "min"], [s, "sec"]].map(function(x, i){
      return '<div><b' + (i === 0 ? ' style="color:#9E2418"' : '') + '>' + String(x[0]).padStart(i === 0 ? 1 : 2, "0") + '</b><span>' + x[1] + '</span></div>';
    }).join("");
    var frac = 1 - left / (v.timeoutDays * DAY);
    $("#bar").style.width = (frac * 100).toFixed(2) + "%";
    $("#t-meta").textContent = "Deadline " + fmtDate(deadline(v)) + ". Last check-in " + ago(v.lastPing) + ".";
    var dark = "#1E173A", red = "#9E2418", grid = "rgba(30,23,58,.18)";
    var pings = v.activity.filter(function(a){ return a.type === "ping" || a.type === "setup"; }).length;
    var key = pings + ":" + frac.toFixed(3);
    var box = $("#trace-box");
    if (box && box.dataset.key !== key){ box.dataset.key = key; box.innerHTML = trace({ beats: pings, frac: frac, animate: false, ink: dark, red: red, grid: grid, label: "Check-in trace. The dot moves toward the deadline marker as time passes." }); }
  }
  setInterval(tick, 1000);

  function execute(){
    var v = S.vault;
    var approved = BigInt(v.approved);
    var movable = BALANCE < approved ? BALANCE : approved;
    var amounts = split(movable, v.heirs.map(function(h){ return h.bps; }));
    var paid = amounts.reduce(function(a, b){ return a + b; }, 0n);
    v.status = "EXECUTED";
    v.executedAt = deadline(v);
    v.payouts = amounts.map(String);
    v.balanceAfter = String(BALANCE - paid);
    v.activity.unshift({ type: "exec", text: "Chainlink Automation sent " + fmtUnits(paid) + " " + v.token + " to " + v.heirs.length + " heirs", at: v.executedAt, tx: fakeHash() });
    save();
    toast("Deadline passed. Chainlink Automation executed your vault and heirs were emailed.");
    render(true);
  }

  // ---------- modal: wallet + tx ----------
  function openModal(html){ $("#modal-body").innerHTML = html; $("#modal").classList.add("open"); var f = $("#modal-body button, #modal-body input"); if (f) f.focus(); }
  function closeModal(){ $("#modal").classList.remove("open"); }
  $("#modal").addEventListener("click", function(e){ if (e.target.id === "modal" && !txBusy) closeModal(); });
  document.addEventListener("keydown", function(e){ if (e.key === "Escape" && $("#modal").classList.contains("open") && !txBusy) closeModal(); });

  function connectFlow(){
    openModal('<h2 id="modal-title" style="font-size:22px">Connect a wallet</h2><p class="muted" style="margin:6px 0 18px">Demo only. No real wallet opens.</p>' +
      '<div style="display:flex;flex-direction:column;gap:10px">' +
      '<button class="wallet-opt" type="button" data-wallet="Browser wallet"><span style="color:var(--accent-ink)">' + I.wallet + '</span>Browser wallet</button>' +
      '<button class="wallet-opt" type="button" data-wallet="WalletConnect"><span style="color:var(--accent-ink)">' + I.link + '</span>WalletConnect</button>' +
      '<button class="wallet-opt" type="button" data-wallet="Coinbase Wallet"><span style="color:var(--accent-ink)">' + I.coin + '</span>Coinbase Wallet</button>' +
      '</div><button class="btn btn-ghost" style="width:100%;margin-top:14px" type="button" data-action="close">Cancel</button>');
  }
  function siweStep(wallet){
    var nonce = Math.random().toString(36).slice(2, 10);
    openModal('<h2 id="modal-title" style="font-size:22px">Sign in to Pulse</h2><p class="muted" style="margin:6px 0 14px">' + esc(wallet) + ' is asking you to sign this message. It’s free and sends no transaction.</p>' +
      '<div class="siwe">pulse.app wants you to sign in with your Ethereum account:\n' + MY_ADDR + '\n\nSign in to manage your Pulse vault.\n\nURI: https://pulse.app\nVersion: 1\nChain ID: 84532\nNonce: ' + nonce + '\nIssued At: ' + new Date().toISOString() + '</div>' +
      '<div style="display:flex;gap:10px;margin-top:16px"><button class="btn btn-primary" style="flex:1" type="button" data-action="sign">Sign message</button><button class="btn btn-ghost" type="button" data-action="close">Cancel</button></div>');
  }

  var txBusy = false;
  function tx(label, detail){
    return new Promise(function(resolve){
      txBusy = true;
      openModal('<div style="text-align:center"><div class="spinner" aria-hidden="true"></div><h2 id="modal-title" style="font-size:20px;margin-top:8px">' + esc(label) + '</h2><p class="muted" id="tx-step" style="margin-top:6px">Confirm in your wallet…</p>' + (detail ? '<p class="muted" style="font-size:13px;margin-top:10px">' + esc(detail) + '</p>' : '') + '</div>');
      setTimeout(function(){ var el = $("#tx-step"); if (el) el.textContent = "Waiting for confirmation on Base Sepolia…"; }, 900);
      setTimeout(function(){ txBusy = false; closeModal(); resolve(fakeHash()); }, 2100);
    });
  }

  // ---------- events ----------
  document.addEventListener("click", function(e){
    var rb = e.target.closest("[data-rail]"); if (rb){ var rail = $("#rail"); var c = rail && rail.querySelector(".fcard"); if (rail && c) rail.scrollBy({ left: Number(rb.getAttribute("data-rail")) * (c.getBoundingClientRect().width + 24), behavior: "smooth" }); return; }
    var t = e.target.closest("[data-action],[data-wallet],[data-token],[data-days],[data-sample]");
    if (!t || t.disabled) return;
    var a = t.getAttribute("data-action");

    if (t.hasAttribute("data-wallet")) { siweStep(t.getAttribute("data-wallet")); return; }
    if (t.hasAttribute("data-token")) { draft.token = t.getAttribute("data-token"); render(); return; }
    if (t.hasAttribute("data-days")) { draft.days = Number(t.getAttribute("data-days")); render(); return; }
    if (t.hasAttribute("data-sample")) { verifyQuery = t.getAttribute("data-sample"); render(); return; }

    switch (a){
      case "connect": connectFlow(); break;
      case "close": closeModal(); break;
      case "sign":
        S.connected = true; S.signed = true; S.address = MY_ADDR; save(); closeModal(); renderWho(); render(); toast("Signed in as " + short(MY_ADDR)); break;
      case "disconnect":
        S.connected = false; S.signed = false; save(); renderWho(); render(); toast("Wallet disconnected"); break;
      case "theme":
        var cur = document.documentElement.getAttribute("data-theme");
        var sysDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        var next = cur ? (cur === "dark" ? "light" : "dark") : (sysDark ? "light" : "dark");
        document.documentElement.setAttribute("data-theme", next);
        try { localStorage.setItem("pulse-theme", next); } catch (err) {}
        render(true); break;
      case "reset":
        try { localStorage.removeItem(STORE); } catch (err) {}
        S = fresh(); draft = newDraft(); verifyQuery = ""; revokeConfirm = false; renderWho(); location.hash = "home"; render(true); toast("Demo reset"); break;
      case "approve":
        var amt = parseAmount(draft.amount);
        if (amt === null || amt === 0n) { updateCreateDerived(); $("#e-amt").textContent = "Enter an amount above 0"; $("#amt").focus(); break; }
        tx("Approve " + draft.token, "Lets Pulse move up to " + draft.amount + " " + draft.token + " after your deadline.").then(function(){ draft.approved = true; render(); toast(draft.token + " approved"); });
        break;
      case "unapprove": draft.approved = false; render(); break;
      case "add-heir": if (draft.heirs.length < 10) { draft.heirs.push({ wallet: "", email: "", pct: "0" }); render(); $("#hw" + (draft.heirs.length - 1)).focus(); } break;
      case "remove-heir": draft.heirs.splice(Number(t.getAttribute("data-i")), 1); render(); break;
      case "even":
        var n = draft.heirs.length, base = Math.floor(10000 / n);
        draft.heirs.forEach(function(h, i){ var b = i === n - 1 ? 10000 - base * (n - 1) : base; h.pct = (b / 100).toFixed(2).replace(/\.00$/, ""); });
        render(); break;
      case "fill":
        draft.heirs = EXAMPLE_HEIRS.map(function(h){ return { wallet: h.wallet, email: h.email, pct: h.pct }; }); render(); break;
      case "create":
        draft.touched = true;
        var r = validateDraft();
        if (r.problems.length) { updateCreateDerived(); break; }
        tx("Create vault", "Calls setupGuard() with " + draft.heirs.length + " heirs and a " + draft.days + "-day period.").then(function(hash){
          var at = now();
          S.vault = {
            token: draft.token, approved: String(r.amt), timeoutDays: draft.days, lastPing: at, status: "ACTIVE", createdAt: at,
            heirs: draft.heirs.map(function(h, i){ return { wallet: h.wallet.trim(), email: h.email.trim(), bps: r.bps[i] }; }),
            activity: [{ type: "setup", text: "Vault created. Setup email sent to " + draft.heirs.length + " heirs", at: at, tx: hash }]
          };
          save(); draft = newDraft(); location.hash = "vault"; toast("Vault created. Your heirs were emailed.");
        });
        break;
      case "ping":
        tx("Check in", "Calls ping(). Your timer restarts at " + S.vault.timeoutDays + " days.").then(function(hash){
          S.vault.lastPing = now();
          S.vault.activity.unshift({ type: "ping", text: "Checked in", at: now(), tx: hash });
          save(); render(); toast("Timer restarted. Next deadline " + fmtDate(deadline(S.vault)));
        });
        break;
      case "revoke-ask": revokeConfirm = true; render(); break;
      case "revoke-cancel": revokeConfirm = false; render(); break;
      case "revoke":
        tx("Revoke vault", "Step 1 of 2: calls revokeGuard().").then(function(h1){
          return tx("Reset approval", "Step 2 of 2: sets your " + S.vault.token + " approval for Pulse to 0.").then(function(){
            S.vault.status = "REVOKED";
            S.vault.activity.unshift({ type: "revoke", text: "Vault revoked and approval set to 0", at: now(), tx: h1 });
            revokeConfirm = false; save(); render(); toast("Vault revoked");
          });
        });
        break;
      case "skip30": S.offset += 30 * DAY; save(); tick(); render(); toast("Skipped 30 days"); break;
      case "skipEnd": S.offset = deadline(S.vault) - Date.now() - 10000; save(); render(); toast("10 seconds to the deadline. Watch the timer."); break;
      case "skipReset": S.offset = 0; save(); render(); break;
    }
  });

  document.addEventListener("input", function(e){
    var t = e.target;
    if (t.hasAttribute("data-calc")) { homeCalc[t.getAttribute("data-calc")] = t.getAttribute("data-calc") === "n" ? Number(t.value) : t.value; updateCalc(); return; }
    if (t.hasAttribute("data-heir")) { draft.heirs[Number(t.getAttribute("data-heir"))][t.getAttribute("data-key")] = t.value; updateCreateDerived(); return; }
    if (t.getAttribute("data-field") === "amount") { draft.amount = t.value; updateCreateDerived(); return; }
    if (t.getAttribute("data-field") === "days") { draft.days = Number(t.value); $("#days-big").textContent = draft.days + " days"; $("#days-sub").textContent = "about " + Math.round(draft.days / 30.4) + " months"; $$("[data-days]").forEach(function(b){ b.setAttribute("aria-pressed", String(Number(b.getAttribute("data-days")) === draft.days)); }); updateCreateDerived(); return; }
  });
  document.addEventListener("change", function(e){ if (e.target.hasAttribute("data-calc")) { homeCalc.n = Number(e.target.value); updateCalc(); } });
  document.addEventListener("focusout", function(e){ if (e.target.hasAttribute && e.target.hasAttribute("data-heir")) { draft.touched = true; updateCreateDerived(); } });
  document.addEventListener("submit", function(e){ if (e.target.id === "verify-form") { e.preventDefault(); verifyQuery = $("#vq").value; render(); } });

  // ---------- router ----------
  var ROUTES = ["home", "vault", "create", "verify"];
  function route(){ var h = location.hash.slice(1); return ROUTES.indexOf(h) >= 0 ? h : "home"; }
  var lastRoute = null;
  function render(keepScroll){
    var r = route();
    $$("[data-nav]").forEach(function(a){ if (a.getAttribute("data-nav") === r) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
    var titles = { home: "Pulse — Non-custodial inheritance guard", vault: "Your vault — Pulse", create: "Create a vault — Pulse", verify: "Verify a vault — Pulse" };
    document.title = titles[r];
    var focusId = document.activeElement && document.activeElement.id;
    var html = r === "home" ? viewHome() : r === "vault" ? viewVault() : r === "create" ? viewCreate() : viewVerify();
    $("#view").innerHTML = html;
    if (r === "home") updateCalc();
    initMotion();
    if (r === "create") updateCreateDerived();
    if (r === "vault") tick();
    if (lastRoute !== r && !keepScroll) window.scrollTo(0, 0);
    else if (focusId && document.getElementById(focusId)) document.getElementById(focusId).focus();
    lastRoute = r;
  }
  window.addEventListener("hashchange", function(){ revokeConfirm = false; render(); });

  try { var th = localStorage.getItem("pulse-theme"); if (th) document.documentElement.setAttribute("data-theme", th); } catch (e) {}
  renderWho();
  render();
})();
</script>
</body>
</html>
