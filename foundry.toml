[profile.default]
src = "contracts"
test = "test"
out = "out"
cache_path = "cache_forge"
libs = ["lib-sol", "node_modules"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "@chainlink/contracts/=node_modules/@chainlink/contracts/",
  "forge-std/=lib-sol/forge-std/src/",
]

[fuzz]
runs = 512
